<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
<title id="title">纯色嵌件和孔销如何设计与试样</title><desc id="desc">左图是红色脸颊嵌入黄色主体的截面。右图是独立销连接两个主体。下方用四种孔径配4毫米销试验配合，均为教学尺寸。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#62748a" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="820" rx="20" fill="#f4f7fb"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#193149">
<text x="35" y="56" font-size="29" fill="#193149" font-weight="700">连接要分别解决：对齐、装得进、固定和表面位置</text>
<text x="35" y="98" font-size="22" fill="#556b80" font-weight="400">截面与间隙均为放大示意，不按实际比例绘制。</text>
<rect x="30" y="130" width="505" height="330" rx="14" fill="#fff" stroke="#d6e0ec"/>
<rect x="555" y="130" width="515" height="330" rx="14" fill="#fff" stroke="#d6e0ec"/>
<text x="53" y="171" font-size="25" fill="#193149" font-weight="700">① 脸颊浅嵌件：控制表面位置</text>
<path d="M65,261 H185 V314 H306 V261 H492 V381 H65 Z" fill="#f3ce51" stroke="#9a7b1d" stroke-width="2"/>
<path d="M194,261 H297 V305 H194 Z" fill="#dd6660" stroke="#b54944" stroke-width="2"/>
<path d="M245,259 L316,212" fill="none" stroke="#62748a" stroke-width="2"/>
<text x="323" y="216" font-size="21" fill="#193149" font-weight="400">外表面齐平</text>
<path d="M302,281 L364,241" fill="none" stroke="#62748a" stroke-width="2"/>
<text x="370" y="245" font-size="20" fill="#193149" font-weight="400">轮廓间隙</text>
<path d="M248,314 L360,351" fill="none" stroke="#62748a" stroke-width="2"/>
<text x="367" y="358" font-size="20" fill="#193149" font-weight="400">限位底面</text>
<text x="53" y="419" font-size="21" fill="#556b80" font-weight="400">先打印局部，确认轮廓、深度和齐平。</text>
<text x="578" y="171" font-size="25" fill="#193149" font-weight="700">② 独立定位销：方便对接</text>
<path d="M588,251 H722 V285 H693 V309 H722 V344 H588 Z" fill="#f3ce51" stroke="#9a7b1d" stroke-width="2"/>
<path d="M1016,251 H882 V285 H911 V309 H882 V344 H1016 Z" fill="#edbf3c" stroke="#9a7b1d" stroke-width="2"/>
<rect x="755" y="285" width="98" height="24" rx="4" fill="#899cb0" stroke="#52667c"/>
<path d="M749,297 L719,297" fill="none" stroke="#62748a" stroke-width="2" marker-end="url(#arr)"/>
<path d="M858,297 L886,297" fill="none" stroke="#62748a" stroke-width="2" marker-end="url(#arr)"/>
<text x="774" y="254" font-size="21" fill="#193149" font-weight="400">独立销</text>
<text x="579" y="382" font-size="21" fill="#193149" font-weight="400">定位负责对齐；固定方式另行确定。</text>
<text x="579" y="419" font-size="21" fill="#556b80" font-weight="400">销端、孔深与受力方向也要检查。</text>
<rect x="30" y="480" width="1040" height="292" rx="14" fill="#fff" stroke="#d6e0ec"/>
<text x="53" y="521" font-size="25" fill="#193149" font-weight="700">③ 同方向、同材料试样：4.00 mm 销配四种设计孔径</text>
<circle cx="170" cy="593" r="35" fill="#bdd4e6"/>
<circle cx="170" cy="593" r="27" fill="#607f9c"/>
<text x="103" y="661" font-size="23" fill="#193149" font-weight="400">4.10 mm 孔</text>
<text x="74" y="701" font-size="22" fill="#556b80" font-weight="400">直径差 0.10 mm</text>
<circle cx="420" cy="593" r="35" fill="#bdd4e6"/>
<circle cx="420" cy="593" r="27" fill="#607f9c"/>
<text x="353" y="661" font-size="23" fill="#193149" font-weight="400">4.20 mm 孔</text>
<text x="324" y="701" font-size="22" fill="#556b80" font-weight="400">直径差 0.20 mm</text>
<circle cx="670" cy="593" r="35" fill="#bdd4e6"/>
<circle cx="670" cy="593" r="27" fill="#607f9c"/>
<text x="603" y="661" font-size="23" fill="#193149" font-weight="400">4.30 mm 孔</text>
<text x="574" y="701" font-size="22" fill="#556b80" font-weight="400">直径差 0.30 mm</text>
<circle cx="920" cy="593" r="35" fill="#bdd4e6"/>
<circle cx="920" cy="593" r="27" fill="#607f9c"/>
<text x="853" y="661" font-size="23" fill="#193149" font-weight="400">4.40 mm 孔</text>
<text x="824" y="701" font-size="22" fill="#556b80" font-weight="400">直径差 0.40 mm</text>
<text x="53" y="747" font-size="22" fill="#556b80" font-weight="400">以上为试样设计值；直径差的一半才是同心条件下的单边间隙。</text>
<text x="35" y="805" font-size="22" fill="#556b80" font-weight="400">零件装好后，再检查实际接缝、稳定性与是否需要补印。</text>
</g></svg>
