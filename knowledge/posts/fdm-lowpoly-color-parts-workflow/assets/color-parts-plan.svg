<text x="40" y="696" font-size="25" fill="#193149" font-weight="700">先做配合与脸部小样 → 按颜色分批打印 → 干装检查 → 固定组装</text>
<text x="40" y="735" font-size="22" fill="#556b80" font-weight="400">不需要把每个三角面单独拆开；同色区域也可因方向与强度继续分件。</text>
