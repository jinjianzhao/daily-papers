<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="title desc">
<title id="title">打印件如何进入涂装流程</title><desc id="desc">树脂打印需要按材料完成清洗、干燥、后固化，FDM需要冷却和去支撑；之后完成试装、修整、底漆、主体色、阴影高光和保护漆。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.7"/></marker></defs>
<rect width="1100" height="1000" rx="22" fill="#f5f8fc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#172b43">
<text x="38" y="57" font-size="30" fill="#172b43" font-weight="700">从打印到涂装：先处理表面，再画颜色</text>
<rect x="35" y="92" width="505" height="157" rx="16" fill="#e6effc" stroke="#d6e0eb"/>
<rect x="560" y="92" width="505" height="157" rx="16" fill="#e5f4ef" stroke="#d6e0eb"/>
<text x="60" y="133" font-size="26" fill="#172b43" font-weight="700">树脂打印件</text>
<text x="60" y="176" font-size="23" fill="#172b43" font-weight="400">按材料完成清洗 → 干燥 → 后固化</text>
<text x="60" y="215" font-size="22" fill="#52667c" font-weight="400">去支撑时机遵循对应材料流程</text>
<text x="585" y="133" font-size="26" fill="#172b43" font-weight="700">FDM 打印件</text>
<text x="585" y="176" font-size="23" fill="#172b43" font-weight="400">冷却取件 → 去支撑 → 去毛边</text>
<text x="585" y="215" font-size="22" fill="#52667c" font-weight="400">不需要紫外后固化</text>
<path d="M288,250 L288,274" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M813,250 L813,274" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M288,274 L813,274" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M550,274 L550,298" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="301" width="940" height="112" rx="16" fill="#ffffff" stroke="#d6e0eb"/>
<circle cx="123" cy="340" r="22" fill="#326a91"/>
<text x="116" y="349" font-size="24" fill="white" font-weight="700">1</text>
<text x="160" y="342" font-size="26" fill="#172b43" font-weight="700">试装、补缝、打磨</text>
<text x="160" y="380" font-size="23" fill="#172b43" font-weight="400">检查配合；修整支撑痕迹与接缝</text>
<text x="610" y="342" font-size="20" fill="#52667c" font-weight="400">打印件的表面缺陷在这里处理</text>
<path d="M550,414 L550,431" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="433" width="940" height="112" rx="16" fill="#ffffff" stroke="#d6e0eb"/>
<circle cx="123" cy="472" r="22" fill="#326a91"/>
<text x="116" y="481" font-size="24" fill="white" font-weight="700">2</text>
<text x="160" y="474" font-size="26" fill="#172b43" font-weight="700">清理干燥、薄涂底漆</text>
<text x="160" y="512" font-size="23" fill="#172b43" font-weight="400">改善附着；检查表面是否仍有缺陷</text>
<text x="610" y="474" font-size="20" fill="#52667c" font-weight="400">发现问题 → 局部修整 → 再补底漆</text>
<path d="M550,546 L550,563" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="565" width="940" height="112" rx="16" fill="#ffffff" stroke="#d6e0eb"/>
<circle cx="123" cy="604" r="22" fill="#326a91"/>
<text x="116" y="613" font-size="24" fill="white" font-weight="700">3</text>
<text x="160" y="606" font-size="26" fill="#172b43" font-weight="700">主体色</text>
<text x="160" y="644" font-size="23" fill="#172b43" font-weight="400">皮肤、头发、衣服、装备分别上色</text>
<text x="610" y="606" font-size="20" fill="#52667c" font-weight="400">笔涂控制局部；喷笔处理大面与渐变</text>
<path d="M550,678 L550,695" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="697" width="940" height="112" rx="16" fill="#ffffff" stroke="#d6e0eb"/>
<circle cx="123" cy="736" r="22" fill="#326a91"/>
<text x="116" y="745" font-size="24" fill="white" font-weight="700">4</text>
<text x="160" y="738" font-size="26" fill="#172b43" font-weight="700">阴影、高光、细节</text>
<text x="160" y="776" font-size="23" fill="#172b43" font-weight="400">凹处加深；选定受光位置提亮</text>
<text x="610" y="738" font-size="20" fill="#52667c" font-weight="400">渍洗、分层、干扫与细笔可组合</text>
<path d="M550,810 L550,827" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="829" width="940" height="112" rx="16" fill="#ffffff" stroke="#d6e0eb"/>
<circle cx="123" cy="868" r="22" fill="#326a91"/>
<text x="116" y="877" font-size="24" fill="white" font-weight="700">5</text>
<text x="160" y="870" font-size="26" fill="#172b43" font-weight="700">保护漆、最终装配</text>
<text x="160" y="908" font-size="23" fill="#172b43" font-weight="400">按部位调整光泽；保护已有涂层</text>
<text x="610" y="870" font-size="20" fill="#52667c" font-weight="400">各涂层达到产品规定状态后再装配</text>
<text x="40" y="982" font-size="21" fill="#52667c" font-weight="400">示意流程：分件、支撑移除和装配顺序按材料、结构与涂装需求调整。</text>
</g></svg>
