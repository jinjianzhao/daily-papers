<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">四种毫米参数，分别回答什么问题</title><desc id="desc">层高描述高度间隔；像素间距描述平面采样；最小细节描述可成形结构；尺寸误差描述成品与设计的差。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.7"/></marker></defs>
<rect width="1100" height="760" rx="22" fill="#f5f8fc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#172b43">
<text x="38" y="57" font-size="32" fill="#172b43" font-weight="700">“精度”要先拆成四个问题</text>
<text x="38" y="96" font-size="22" fill="#52667c" font-weight="400">下列是独立教学示意，不是同一机器的性能测试。</text>
<rect x="30" y="125" width="505" height="276" rx="16" fill="#ffffff" stroke="#d6e0eb"/>
<rect x="565" y="125" width="505" height="276" rx="16" fill="#ffffff" stroke="#d6e0eb"/>
<rect x="30" y="425" width="505" height="276" rx="16" fill="#ffffff" stroke="#d6e0eb"/>
<rect x="565" y="425" width="505" height="276" rx="16" fill="#ffffff" stroke="#d6e0eb"/>
<text x="53" y="163" font-size="26" fill="#172b43" font-weight="700">① 层高：相邻层差多高</text>
<rect x="62" y="186" width="180" height="21" fill="#87b7e5" stroke="#4176a5"/>
<rect x="62" y="209" width="180" height="21" fill="#aacfeb" stroke="#4176a5"/>
<rect x="62" y="232" width="180" height="21" fill="#87b7e5" stroke="#4176a5"/>
<rect x="62" y="255" width="180" height="21" fill="#aacfeb" stroke="#4176a5"/>
<rect x="62" y="278" width="180" height="21" fill="#87b7e5" stroke="#4176a5"/>
<path d="M272,209 L272,232" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M262,209 L282,209" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M262,232 L282,232" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="293" y="229" font-size="24" fill="#172b43" font-weight="400">例：0.05 mm</text>
<text x="53" y="332" font-size="22" fill="#172b43" font-weight="400">影响高度方向分层与曲面台阶。</text>
<text x="53" y="372" font-size="22" fill="#52667c" font-weight="400">不等于孔径误差是 ±0.05 mm。</text>
<text x="588" y="163" font-size="26" fill="#172b43" font-weight="700">② XY 像素：平面采样多密</text>
<rect x="600" y="186" width="30" height="25" fill="#b2dacd" stroke="#548f7c"/>
<rect x="600" y="211" width="30" height="25" fill="#d4eae3" stroke="#548f7c"/>
<rect x="600" y="236" width="30" height="25" fill="#b2dacd" stroke="#548f7c"/>
<rect x="600" y="261" width="30" height="25" fill="#d4eae3" stroke="#548f7c"/>
<rect x="630" y="186" width="30" height="25" fill="#d4eae3" stroke="#548f7c"/>
<rect x="630" y="211" width="30" height="25" fill="#b2dacd" stroke="#548f7c"/>
<rect x="630" y="236" width="30" height="25" fill="#d4eae3" stroke="#548f7c"/>
<rect x="630" y="261" width="30" height="25" fill="#b2dacd" stroke="#548f7c"/>
<rect x="660" y="186" width="30" height="25" fill="#b2dacd" stroke="#548f7c"/>
<rect x="660" y="211" width="30" height="25" fill="#d4eae3" stroke="#548f7c"/>
<rect x="660" y="236" width="30" height="25" fill="#b2dacd" stroke="#548f7c"/>
<rect x="660" y="261" width="30" height="25" fill="#d4eae3" stroke="#548f7c"/>
<rect x="690" y="186" width="30" height="25" fill="#d4eae3" stroke="#548f7c"/>
<rect x="690" y="211" width="30" height="25" fill="#b2dacd" stroke="#548f7c"/>
<rect x="690" y="236" width="30" height="25" fill="#d4eae3" stroke="#548f7c"/>
<rect x="690" y="261" width="30" height="25" fill="#b2dacd" stroke="#548f7c"/>
<path d="M600,301 L630,301" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M600,294 L600,308" fill="none" stroke="#64748b" stroke-width="2"/>
<path d="M630,294 L630,308" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="746" y="226" font-size="22" fill="#172b43" font-weight="400">例：X 方向 0.02 mm</text>
<text x="746" y="262" font-size="22" fill="#172b43" font-weight="400">描述采样间隔。</text>
<text x="588" y="338" font-size="22" fill="#172b43" font-weight="400">光学与固化会影响实际边界。</text>
<text x="588" y="372" font-size="22" fill="#52667c" font-weight="400">不等于尺寸误差是 ±0.02 mm。</text>
<text x="53" y="463" font-size="26" fill="#172b43" font-weight="700">③ 最小细节：什么结构能成形</text>
<path d="M65,570 V534 H120 V510 H141 V534 H200 V570" fill="#e0d1ee" stroke="#8b65a8" stroke-width="2"/>
<path d="M248,570 V534 H298 V553 H318 V534 H378 V570" fill="#e0d1ee" stroke="#8b65a8" stroke-width="2"/>
<text x="75" y="608" font-size="22" fill="#172b43" font-weight="400">凸起线条</text>
<text x="265" y="608" font-size="22" fill="#172b43" font-weight="400">凹槽</text>
<text x="53" y="654" font-size="22" fill="#172b43" font-weight="400">宽度、深度、方向与长度都有关。</text>
<text x="53" y="690" font-size="22" fill="#52667c" font-weight="400">能打印 ≠ 拆支撑、运输时不断裂。</text>
<text x="588" y="463" font-size="26" fill="#172b43" font-weight="700">④ 尺寸误差：与设计差多少</text>
<text x="595" y="510" font-size="24" fill="#172b43" font-weight="400">设计：20.00 mm</text>
<text x="595" y="552" font-size="24" fill="#172b43" font-weight="400">公差示例：±0.20 mm</text>
<path d="M615,591 L1005,591" fill="none" stroke="#d1dce7" stroke-width="12"/>
<path d="M810,577 L810,607" fill="none" stroke="#347ba3" stroke-width="3"/>
<text x="590" y="637" font-size="22" fill="#172b43" font-weight="400">19.80</text>
<text x="766" y="637" font-size="22" fill="#172b43" font-weight="400">20.00</text>
<text x="950" y="637" font-size="22" fill="#172b43" font-weight="400">20.20</text>
<text x="588" y="690" font-size="22" fill="#52667c" font-weight="400">用实际测量值判断是否落入范围。</text>
</g></svg>
