<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="890" viewBox="0 0 1000 890" role="img" aria-labelledby="title desc">
<title id="title">从高低模到烘焙和材质</title><desc id="desc">高模与低模加UV用于烘焙，获得网格信息贴图。材质绘制使用这些信息，输出材质纹理；引擎同时使用运行时网格与材质。</desc>
<defs><marker id="arrow" refX="8" refY="4.5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#5778a3"/></marker></defs>
<rect width="1000" height="890" rx="18" fill="#f5f8fc"/>
<text x="36" y="51" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#283d55" text-anchor="start">一条常见的高模 → 低模 → 材质路线</text>
<text x="36" y="87" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d7189" text-anchor="start">制作阶段可以使用不同工具；资产不一定全部采用这条路线。</text>
<rect x="40" y="120" width="430" height="95" rx="12" fill="#e8efff" stroke="#cfdae6"/>
<text x="65" y="158" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#283d55" text-anchor="start">高模</text>
<text x="65" y="190" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">提供形状与细节参考</text>
<rect x="530" y="120" width="430" height="95" rx="12" fill="#e5f4ec" stroke="#cfdae6"/>
<text x="555" y="158" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#283d55" text-anchor="start">运行时网格 + UV</text>
<text x="555" y="190" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">确定几何与贴图对应位置</text>
<path d="M255 216 L255 250 L435 250 L435 282" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M745 216 L745 250 L565 250 L565 282" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="180" y="284" width="640" height="93" rx="12" fill="#fff0db" stroke="#cfdae6"/>
<text x="500" y="322" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#283d55" text-anchor="middle">烘焙</text>
<text x="500" y="354" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="middle">根据模型关系与设置计算纹理信息</text>
<path d="M500 378 L500 413" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="180" y="416" width="640" height="93" rx="12" fill="#fff" stroke="#cfdae6"/>
<text x="500" y="454" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">法线、曲率、遮挡等网格贴图</text>
<text x="500" y="486" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="middle">供表面光照、材质绘制或遮罩使用</text>
<path d="M500 510 L500 545" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="180" y="548" width="640" height="93" rx="12" fill="#efe9fb" stroke="#cfdae6"/>
<text x="500" y="586" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">贴图 / 材质绘制与组织</text>
<text x="500" y="618" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="middle">颜色、粗糙度、金属度等纹理和参数</text>
<path d="M500 642 L500 677" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="100" y="680" width="800" height="96" rx="12" fill="#e8efff" stroke="#cfdae6"/>
<text x="500" y="719" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">引擎：运行时网格 + 材质 / 着色器 + 灯光</text>
<text x="500" y="751" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="middle">一起决定最终画面与实际开销</text>
<text x="36" y="827" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">法线贴图改变表面光照计算；它本身不会增加轮廓上的几何顶点。</text>
<text x="36" y="860" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d7189" text-anchor="start">运行时网格继续作为几何使用，高模在这条路线中主要提供制作信息。</text>
</svg>
