<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="875" viewBox="0 0 1080 875" role="img" aria-labelledby="title desc">
<title id="title">游戏制作的五个阶段与交付物</title><desc id="desc">前期筹备确定方向与原型，概念原画提供设计，三维制作提供资产，绑定动画特效提供动态内容，引擎整合与测试形成可玩版本。程序与QA等工作贯穿多个阶段。</desc>
<defs><marker id="arrow" refX="8" refY="4.5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#5778a3"/></marker></defs>
<rect width="1080" height="875" rx="18" fill="#f5f8fc"/>
<text x="38" y="53" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="700" fill="#283d55" text-anchor="start">游戏制作：每一步向可玩版本交付什么？</text>
<text x="38" y="91" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d7189" text-anchor="start">从方向与设计，到资产、动态内容、系统整合与验证。</text>
<text x="52" y="136" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#283d55" text-anchor="start">阶段</text>
<text x="328" y="136" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#283d55" text-anchor="start">主要参与者</text>
<text x="692" y="136" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#283d55" text-anchor="start">代表性交付物</text>
<rect x="30" y="156" width="1020" height="88" rx="12" fill="#fff" stroke="#cfdae6"/>
<rect x="43" y="166" width="253" height="68" rx="12" fill="#e8efff" stroke="#cfdae6"/>
<text x="59" y="207" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#283d55" text-anchor="start">01 前期筹备</text>
<text x="328" y="207" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">制作人／策划／美术负责人</text>
<text x="692" y="207" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">玩法规则、视觉方向、原型</text>
<path d="M165 245 L165 264" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="265" width="1020" height="88" rx="12" fill="#fff" stroke="#cfdae6"/>
<rect x="43" y="275" width="253" height="68" rx="12" fill="#e5f4ec" stroke="#cfdae6"/>
<text x="59" y="316" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#283d55" text-anchor="start">02 概念与原画</text>
<text x="328" y="316" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">原画／UI／相关设计岗位</text>
<text x="692" y="316" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">外观方案、结构与材质说明</text>
<path d="M165 354 L165 373" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="374" width="1020" height="88" rx="12" fill="#fff" stroke="#cfdae6"/>
<rect x="43" y="384" width="253" height="68" rx="12" fill="#fff0db" stroke="#cfdae6"/>
<text x="59" y="425" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#283d55" text-anchor="start">03 3D 资产制作</text>
<text x="328" y="425" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">建模／贴图／材质</text>
<text x="692" y="425" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">网格、UV、贴图与材质数据</text>
<path d="M165 463 L165 482" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="483" width="1020" height="88" rx="12" fill="#fff" stroke="#cfdae6"/>
<rect x="43" y="493" width="253" height="68" rx="12" fill="#efe9fb" stroke="#cfdae6"/>
<text x="59" y="534" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#283d55" text-anchor="start">04 动效与绑定</text>
<text x="328" y="534" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">绑定／动画／特效</text>
<text x="692" y="534" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">可操作角色、动作与实时效果</text>
<path d="M165 572 L165 591" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="592" width="1020" height="88" rx="12" fill="#fff" stroke="#cfdae6"/>
<rect x="43" y="602" width="253" height="68" rx="12" fill="#fce9ed" stroke="#cfdae6"/>
<text x="59" y="643" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#283d55" text-anchor="start">05 引擎整合与测试</text>
<text x="328" y="643" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">关卡／程序／TA／QA 等</text>
<text x="692" y="643" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">可玩场景、系统逻辑与问题修复</text>
<rect x="30" y="730" width="1020" height="112" rx="12" fill="#edf3f9" stroke="#cfdae6"/>
<text x="52" y="768" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#283d55" text-anchor="start">贯穿制作：玩法验证、程序、技术支持、质量检查与跨组反馈</text>
<text x="52" y="804" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="start">出现问题会回到相关环节修改；岗位可以并行工作，也可以由同一人兼任。</text>
</svg>
