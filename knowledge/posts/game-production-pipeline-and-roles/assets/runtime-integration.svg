<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690" role="img" aria-labelledby="title desc">
<title id="title">技能在引擎中的整合关系</title><desc id="desc">玩家输入经过状态和资源检查，进入技能逻辑与时序，协调动画、游戏判定、特效声音和界面更新。</desc>
<defs><marker id="arrow" refX="8" refY="4.5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#5778a3"/></marker></defs>
<rect width="1080" height="690" rx="18" fill="#f5f8fc"/>
<text x="38" y="52" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#283d55" text-anchor="start">一次剑气技能，怎样从按钮变成完整体验？</text>
<text x="38" y="89" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d7189" text-anchor="start">教学示意：共享状态与时序，具体系统组织由项目决定。</text>
<rect x="35" y="123" width="240" height="95" rx="12" fill="#e8efff" stroke="#cfdae6"/>
<text x="155.0" y="162" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">玩家输入</text>
<text x="155.0" y="194" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#283d55" text-anchor="middle">按下技能按钮</text>
<rect x="350" y="123" width="330" height="95" rx="12" fill="#e8efff" stroke="#cfdae6"/>
<text x="515.0" y="162" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">条件检查</text>
<text x="515.0" y="194" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#283d55" text-anchor="middle">资源、冷却、当前状态</text>
<rect x="755" y="123" width="290" height="95" rx="12" fill="#e8efff" stroke="#cfdae6"/>
<text x="900.0" y="162" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">进入技能状态</text>
<text x="900.0" y="194" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#283d55" text-anchor="middle">条件通过后开始执行</text>
<path d="M276 170 L347 170" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M681 170 L752 170" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M900 219 L900 268 L690 268" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="345" y="237" width="345" height="106" rx="12" fill="#e5f4ec" stroke="#cfdae6"/>
<text x="517" y="278" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#283d55" text-anchor="middle">技能逻辑与时序</text>
<text x="517" y="312" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#283d55" text-anchor="middle">协调事件、状态与结束条件</text>
<path d="M517 344 L517 397" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M151 398 H928" fill="none" stroke="#5778a3" stroke-width="3"/>
<path d="M151 398 L151 442" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="35" y="445" width="233" height="133" rx="12" fill="#fff0db" stroke="#cfdae6"/>
<text x="151" y="484" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">动画</text>
<text x="151" y="520" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#283d55" text-anchor="middle">播放与过渡</text>
<text x="151" y="550" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#283d55" text-anchor="middle">角色姿态变化</text>
<path d="M410 398 L410 442" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="294" y="445" width="233" height="133" rx="12" fill="#fff0db" stroke="#cfdae6"/>
<text x="410" y="484" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">游戏判定</text>
<text x="410" y="520" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#283d55" text-anchor="middle">命中、资源与伤害</text>
<text x="410" y="550" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#283d55" text-anchor="middle">按玩法规则更新</text>
<path d="M669 398 L669 442" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="553" y="445" width="233" height="133" rx="12" fill="#fff0db" stroke="#cfdae6"/>
<text x="669" y="484" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">特效 / 声音</text>
<text x="669" y="520" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#283d55" text-anchor="middle">位置、触发与持续</text>
<text x="669" y="550" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#283d55" text-anchor="middle">形成视听反馈</text>
<path d="M928 398 L928 442" fill="none" stroke="#5778a3" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="812" y="445" width="233" height="133" rx="12" fill="#fff0db" stroke="#cfdae6"/>
<text x="928" y="484" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#283d55" text-anchor="middle">UI</text>
<text x="928" y="520" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#283d55" text-anchor="middle">冷却、数值与状态</text>
<text x="928" y="550" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#283d55" text-anchor="middle">更新界面显示</text>
<text x="38" y="624" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#283d55" text-anchor="start">技能伤害由规则和逻辑实现，视觉效果需要与判定范围和时机协调。</text>
<text x="38" y="659" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#5d7189" text-anchor="start">还要检查：被打断、未命中、资源不足、连续输入等分支是否正确。</text>
</svg>
