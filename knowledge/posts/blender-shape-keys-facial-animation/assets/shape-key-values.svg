<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">Shape Key 的零、半幅和完整目标</title><desc id="desc">三张对应网格示意图：Basis、Smile0.5、Smile1。顶点数和对应关系保持一致，嘴角位置随权重变化。</desc>
