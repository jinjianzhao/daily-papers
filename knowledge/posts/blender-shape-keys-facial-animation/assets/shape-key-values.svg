<text x="35" y="619" font-size="23" fill="#1b344c" font-weight="700">目标键保存顶点位置；求值时计算相对参考键的位移，再乘 Value。</text>
<text x="35" y="657" font-size="21" fill="#526b81" font-weight="400">红点标示对应顶点；图为二维概念示意，实际脸部还要处理三维轮廓和接触。</text>
