<svg xmlns="http://www.w3.org/2000/svg" width="1318" height="509" viewBox="0 0 1318 509" role="img" aria-labelledby="title"><title id="title">软性蒙皮、刚性部件转动和可打印实体关节的区别示意</title><rect x="1" y="1" width="1316" height="507" rx="18" fill="#f7fafc" stroke="#dfe7ef" stroke-width="2"/><text x="34" y="48" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" fill="#1769aa" font-weight="700" text-anchor="start">肘部：连续变形、刚性转动与实体关节</text><rect x="24" y="78" width="410" height="405" rx="16" fill="#fff" stroke="#d7e1eb" stroke-width="2"/><text x="44" y="118" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" fill="#1d4f73" font-weight="700" text-anchor="start">软性皮肤 / 衣袖</text><rect x="454" y="78" width="410" height="405" rx="16" fill="#fff" stroke="#d7e1eb" stroke-width="2"/><text x="474" y="118" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" fill="#1d4f73" font-weight="700" text-anchor="start">硬甲 / 机械部件</text><rect x="884" y="78" width="410" height="405" rx="16" fill="#fff" stroke="#d7e1eb" stroke-width="2"/><text x="904" y="118" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" fill="#1d4f73" font-weight="700" text-anchor="start">打印后仍要能动</text><path d="M82 201 Q174 199 216 246 L335 321 L304 367 L183 289 Q153 257 82 257 Z" fill="#beddec" stroke="#477b98" stroke-width="3"/><path d="M115 201L115 258" stroke="#719db2" stroke-width="2" fill="none"/><path d="M151 207L146 264" stroke="#719db2" stroke-width="2" fill="none"/><path d="M187 222L171 278" stroke="#719db2" stroke-width="2" fill="none"/><path d="M218 246L191 295" stroke="#719db2" stroke-width="2" fill="none"/><path d="M253 268L223 316" stroke="#719db2" stroke-width="2" fill="none"/><path d="M290 292L259 340" stroke="#719db2" stroke-width="2" fill="none"/><path d="M90 231L187 251" stroke="#b37423" stroke-width="7" fill="none"/><path d="M187 251L319 340" stroke="#b37423" stroke-width="7" fill="none"/><circl