<svg xmlns="http://www.w3.org/2000/svg" width="1338" height="678" viewBox="0 0 1338 678" role="img" aria-labelledby="title"><title id="title">同一个角色在游戏、骨骼绑定和固定姿态打印中的三种分件示意</title><rect x="1" y="1" width="1336" height="676" rx="18" fill="#f7fafc" stroke="#dfe7ef" stroke-width="2"/><text x="36" y="48" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="30" fill="#1769aa" font-weight="700" text-anchor="start">同一个角色：分件由用途决定</text><text x="36" y="82" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">颜色表示本方案的分组；以下是本文示意，并非唯一制作规范。</text><rect x="24" y="110" width="414" height="540" rx="16" fill="#fff" stroke="#d7e1eb" stroke-width="2"/><text x="46" y="150" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" fill="#1d4f73" font-weight="700" text-anchor="start">游戏：按可替换模块组织</text><text x="46" y="183" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">运行时还可按项目需要合并</text><rect x="197" y="211" width="62" height="61" rx="10" fill="#c5b5e8" stroke="#526579" stroke-width="2"/><rect x="177" y="286" width="102" height="114" rx="18" fill="#bfd9ee" stroke="#526579" stroke-width="2"/><rect x="137" y="294" width="32" height="106" rx="12" fill="#bfd9ee" stroke="#526579" stroke-width="2"/><rect x="287" y="294" width="32" height="106" rx="12" fill="#bfd9ee" stroke="#526579" stroke-width="2"/><rect x="183" y="412" width="37" height="125" rx="10" fill="#bfd9ee" stroke="#526579" stroke-width="2"/><rect x="236" y="412" width="37" height="125" rx="10" fill="#bfd9ee" stroke="#526579" stroke-width="2"/><rect x="169" y="530" width="51" height="24" rx="7" fill="#bfd9ee" stroke="#526579" stroke-width="2"/><rect x="236" y="530" width="51" height="24" rx="7" fill="#bfd9ee" stroke="#526579" stroke-width="2"/><path d="M208 245L248 245" stroke="#334155" stroke-width="5" fill="none"/><text x="48" y="254" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">头盔模块</text><path d="M134 248L195 240" stroke="#8b5fb0" stroke-width="2" fill="none"/><text x="48" y="402" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">主体模块</text><path d="M134 397L177 363" stroke="#4186b0" stroke-width="2" fill="none"/><text x="46" y="602" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" fill="#334155" font-weight="700" text-anchor="start">换装边界 ≠ 每根骨骼的边界</text><text x="46" y="630" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">绘制开销、材质、LOD 共同约束</text><rect x="462" y="110" width="414" height="540" rx="16" fill="#fff" stroke="#d7e1eb" stroke-width="2"/><text x="484" y="150" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" fill="#1d4f73" font-weight="700" text-anchor="start">Rigging：按变形规律绑定</text><text x="484" y="183" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">骨骼数量与 mesh 数量不相等</text><rect x="635" y="211" width="62" height="61" rx="10" fill="#cbd5e1" stroke="#526579" stroke-width="2"/><rect x="615" y="286" width="102" height="114" rx="18" fill="#b6d8e8" stroke="#526579" stroke-width="2"/><rect x="575" y="294" width="32" height="106" rx="12" fill="#b6d8e8" stroke="#526579" stroke-width="2"/><rect x="725" y="294" width="32" height="106" rx="12" fill="#b6d8e8" stroke="#526579" stroke-width="2"/><rect x="621" y="412" width="37" height="125" rx="10" fill="#b6d8e8" stroke="#526579" stroke-width="2"/><rect x="674" y="412" width="37" height="125" rx="10" fill="#b6d8e8" stroke="#526579" stroke-width="2"/><rect x="607" y="530" width="51" height="24" rx="7" fill="#b6d8e8" stroke="#526579" stroke-width="2"/><rect x="674" y="530" width="51" height="24" rx="7" fill="#b6d8e8" stroke="#526579" stroke-width="2"/><path d="M646 245L686 245" stroke="#334155" stroke-width="5" fill="none"/><path d="M592 305L592 345" stroke="#b37423" stroke-width="6" fill="none"/><circle cx="592" cy="347" r="7" fill="#f6c86f" stroke="#334155" stroke-width="2"/><path d="M592 355L592 390" stroke="#b37423" stroke-width="6" fill="none"/><path d="M740 305L740 345" stroke="#b37423" stroke-width="6" fill="none"/><circle cx="740" cy="347" r="7" fill="#f6c86f" stroke="#334155" stroke-width="2"/><path d="M740 355L740 390" stroke="#b37423" stroke-width="6" fill="none"/><text x="485" y="263" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">硬甲刚性跟随</text><text x="485" y="578" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">软组织按权重变形</text><text x="484" y="602" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" fill="#334155" font-weight="700" text-anchor="start">变形区可保持连续网格</text><text x="484" y="630" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">独立硬甲也可共用同一套骨架</text><rect x="900" y="110" width="414" height="540" rx="16" fill="#fff" stroke="#d7e1eb" stroke-width="2"/><text x="922" y="150" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="23" fill="#1d4f73" font-weight="700" text-anchor="start">打印：按制造与装配切分</text><text x="922" y="183" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">这里以固定姿态手办为例</text><rect x="1073" y="211" width="62" height="61" rx="10" fill="#cbd5e1" stroke="#526579" stroke-width="2"/><rect x="1053" y="286" width="102" height="114" rx="18" fill="#d8e3ec" stroke="#526579" stroke-width="2"/><rect x="1013" y="294" width="32" height="106" rx="12" fill="#d8e3ec" stroke="#526579" stroke-width="2"/><rect x="1163" y="294" width="32" height="106" rx="12" fill="#d8e3ec" stroke="#526579" stroke-width="2"/><rect x="1059" y="412" width="37" height="125" rx="10" fill="#c5d9cc" stroke="#526579" stroke-width="2"/><rect x="1112" y="412" width="37" height="125" rx="10" fill="#c5d9cc" stroke="#526579" stroke-width="2"/><rect x="1045" y="530" width="51" height="24" rx="7" fill="#c5d9cc" stroke="#526579" stroke-width="2"/><rect x="1112" y="530" width="51" height="24" rx="7" fill="#c5d9cc" stroke="#526579" stroke-width="2"/><path d="M1084 245L1124 245" stroke="#334155" stroke-width="5" fill="none"/><path d="M1037 403L1171 403" stroke="#c56739" stroke-width="4" fill="none" stroke-dasharray="8 6"/><text x="925" y="405" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">腰部切缝</text><text x="922" y="602" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="19" fill="#334155" font-weight="700" text-anchor="start">切面封口，增加定位与连接结构</text><text x="922" y="630" font-family="Arial, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">尺寸、方向、壁厚、强度共同约束</text></svg>