<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Ribbon 的主要计算链</title><desc id="desc">动画师输入控制骨骼，骨骼使辅助网格变形，辅助网格的顶点位置引导变形骨骼，最终影响角色网格。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#5073a0"/></marker></defs>
<rect width="1000" height="650" rx="18" fill="#f5f8fc"/>
<text x="38" y="50" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" fill="#253a52" font-weight="700">嘴部 Ribbon：先形成引导，再驱动脸部</text>
<text x="38" y="86" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#61748a" font-weight="400">教学整理，省略局部控制、具体约束与修正参数。</text>
<rect x="140" y="116" width="720" height="84" rx="12" fill="#e9f0ff" stroke="#c8d7e6"/>
<text x="172" y="150" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#253a52" font-weight="700">输入：控制骨骼</text>
<text x="172" y="180" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#546a82" font-weight="400">提供整体或区域运动</text>
<path d="M500 201 L500 226" fill="none" stroke="#5073a0" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="140" y="228" width="720" height="84" rx="12" fill="#e5f5ee" stroke="#c8d7e6"/>
<text x="172" y="262" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#253a52" font-weight="700">Ribbon 辅助网格</text>
<text x="172" y="292" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#546a82" font-weight="400">根据权重形成基础轮廓</text>
<path d="M500 313 L500 338" fill="none" stroke="#5073a0" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="140" y="340" width="720" height="84" rx="12" fill="#fff0da" stroke="#c8d7e6"/>
<text x="172" y="374" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#253a52" font-weight="700">跟随／指向骨骼</text>
<text x="172" y="404" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#546a82" font-weight="400">读取引导顶点的位置</text>
<path d="M500 425 L500 450" fill="none" stroke="#5073a0" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="140" y="452" width="720" height="84" rx="12" fill="#eee8ff" stroke="#c8d7e6"/>
<text x="172" y="486" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#253a52" font-weight="700">最终角色网格</text>
<text x="172" y="516" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#546a82" font-weight="400">由变形骨骼影响表面</text>
<text x="38" y="602" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#253a52" font-weight="400">两组职责：一组影响辅助网格，另一组最终影响角色表面。</text>
<text x="38" y="631" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#61748a" font-weight="400">避免把最终表面的位置重新接回同一个输入驱动，形成计算回路。</text>
</svg>
