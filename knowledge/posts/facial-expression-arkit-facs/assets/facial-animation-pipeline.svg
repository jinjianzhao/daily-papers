<svg xmlns="http://www.w3.org/2000/svg" width="820" height="570" viewBox="0 0 820 570" role="img" aria-label="面部表情从动作输入经过重定向和角色绑定产生几何与画面的流程">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#6892b4"/></marker></defs>
<rect width="820" height="570" rx="15" fill="#f5f9fc"/>
<g font-family="Arial,Microsoft YaHei,sans-serif" fill="#22364c" text-anchor="middle">
<text x="410" y="40" font-size="25" font-weight="bold">从表演数据到角色画面</text>
<g fill="#fff" stroke="#c4d7e7" stroke-width="2"><rect x="30" y="70" width="240" height="80" rx="10"/><rect x="290" y="70" width="240" height="80" rx="10"/><rect x="550" y="70" width="240" height="80" rx="10"/>
<rect x="170" y="205" width="480" height="75" rx="10"/><rect x="170" y="325" width="480" height="100" rx="10"/><rect x="170" y="470" width="480" height="65" rx="10"/></g>
<g font-size="21"><text x="150" y="102">表演采集</text><text x="150" y="131">ARKit 等运动系数</text><text x="410" y="102">视频或模型估计</text><text x="410" y="131">FACS AU 等参数</text><text x="670" y="102">动画师制作</text><text x="670" y="131">关键帧与表演曲线</text>
<text x="410" y="234">校准、重定向与时间编辑</text><text x="410" y="261" font-size="18">调整范围、左右、时序，映射到目标角色控制量</text>
<text x="410" y="356">目标角色面部绑定（Rig）</text><text x="410" y="386" font-size="19">Blendshapes、关节、组合修正</text><text x="410" y="411" font-size="17">每个时刻计算出眼睑、嘴唇、脸颊等部位的形状</text>
<text x="410" y="510">三维几何 + 材质、灯光、相机 → 最终画面</text></g>
<g stroke="#6892b4" stroke-width="2.4" marker-end="url(#arrow)" fill="none"><path d="M150 150 V175 H410 V200"/><path d="M410 150 V200"/><path d="M670 150 V175 H410"/><path d="M410 280 V320"/><path d="M410 425 V465"/></g>
<text x="410" y="557" font-size="16">曲线表示控制量随时间的变化；Rig 决定控制量怎样改变这个角色</text>
</g></svg>