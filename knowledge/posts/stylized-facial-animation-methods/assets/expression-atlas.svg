<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title desc">
<title id="title">六种表情图案组成的教学纹理图集</title>
<desc id="desc">三列两行的面部图案，依次展示平静、微笑、惊讶、闭眼笑、生气和悲伤。通过选择格子的行列索引改变表情，头部网格可以保持不动。</desc>
<rect width="960" height="690" rx="20" fill="#f5f8fc"/>
<text x="35" y="48" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" fill="#203247" font-weight="700" text-anchor="start">纹理 / UV 路线：选择图案所在的格子</text>
<text x="35" y="82" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" fill="#53667c" font-weight="400" text-anchor="start">教学图集（矢量绘制），不是 3D 渲染或任何项目的生产资产。</text>
<rect x="30" y="106" width="292" height="236" rx="12" fill="white" stroke="#cdd8e5"/>
<ellipse cx="176" cy="214" rx="91" ry="80" fill="#ffe1ad" stroke="#bf8b54" stroke-width="2"/>
<ellipse cx="143" cy="205" rx="6" ry="11" fill="#34455b"/>
<ellipse cx="209" cy="205" rx="6" ry="11" fill="#34455b"/>
<path d="M 152 249 L 200 249" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<text x="176" y="314" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#203247" font-weight="400" text-anchor="middle">平静  (c=0, r=1)</text>
<rect x="330" y="106" width="292" height="236" rx="12" fill="white" stroke="#cdd8e5"/>
<ellipse cx="476" cy="214" rx="91" ry="80" fill="#ffe1ad" stroke="#bf8b54" stroke-width="2"/>
<ellipse cx="443" cy="205" rx="6" ry="11" fill="#34455b"/>
<ellipse cx="509" cy="205" rx="6" ry="11" fill="#34455b"/>
<path d="M 442 239 Q 476 264 510 239" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<text x="476" y="314" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#203247" font-weight="400" text-anchor="middle">微笑  (c=1, r=1)</text>
<rect x="630" y="106" width="292" height="236" rx="12" fill="white" stroke="#cdd8e5"/>
<ellipse cx="776" cy="214" rx="91" ry="80" fill="#ffe1ad" stroke="#bf8b54" stroke-width="2"/>
<ellipse cx="743" cy="205" rx="6" ry="11" fill="#34455b"/>
<ellipse cx="809" cy="205" rx="6" ry="11" fill="#34455b"/>
<ellipse cx="776" cy="249" rx="13" ry="20" fill="#65434a"/>
<text x="776" y="314" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#203247" font-weight="400" text-anchor="middle">惊讶  (c=2, r=1)</text>
<rect x="30" y="352" width="292" height="236" rx="12" fill="white" stroke="#cdd8e5"/>
<ellipse cx="176" cy="460" rx="91" ry="80" fill="#ffe1ad" stroke="#bf8b54" stroke-width="2"/>
<path d="M 128 451 Q 143 433 158 451" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<path d="M 194 451 Q 209 433 224 451" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<path d="M 142 485 Q 176 520 210 485" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<text x="176" y="560" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#203247" font-weight="400" text-anchor="middle">闭眼笑  (c=0, r=0)</text>
<rect x="330" y="352" width="292" height="236" rx="12" fill="white" stroke="#cdd8e5"/>
<ellipse cx="476" cy="460" rx="91" ry="80" fill="#ffe1ad" stroke="#bf8b54" stroke-width="2"/>
<ellipse cx="443" cy="451" rx="6" ry="11" fill="#34455b"/>
<ellipse cx="509" cy="451" rx="6" ry="11" fill="#34455b"/>
<path d="M 445 503 Q 476 473 507 503" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<path d="M 425 421 L 459 433" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<path d="M 493 433 L 527 421" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<text x="476" y="560" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#203247" font-weight="400" text-anchor="middle">生气  (c=1, r=0)</text>
<rect x="630" y="352" width="292" height="236" rx="12" fill="white" stroke="#cdd8e5"/>
<ellipse cx="776" cy="460" rx="91" ry="80" fill="#ffe1ad" stroke="#bf8b54" stroke-width="2"/>
<ellipse cx="743" cy="451" rx="6" ry="11" fill="#34455b"/>
<ellipse cx="809" cy="451" rx="6" ry="11" fill="#34455b"/>
<path d="M 745 503 Q 776 473 807 503" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<path d="M 726 433 L 759 421" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<path d="M 793 421 L 826 433" fill="none" stroke="#34455b" stroke-width="5" stroke-linecap="round"/>
<text x="776" y="560" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#203247" font-weight="400" text-anchor="middle">悲伤  (c=2, r=0)</text>
<text x="35" y="635" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#203247" font-weight="400" text-anchor="start">列 c 从左向右编号；行 r 从下向上编号。每格对应一套表面图案。</text>
<text x="35" y="666" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#53667c" font-weight="400" text-anchor="start">换格子不会自动改变脸部轮廓，也不会生成两种表情之间的几何形状。</text>
</svg>
