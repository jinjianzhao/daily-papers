<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" role="img" aria-labelledby="title desc">
<title id="title">线材、树脂和粉末的三种成型示意</title><desc id="desc">线材在喷嘴加热后挤出，树脂在光照的指定区域固化，粉末床则先铺粉再选择性加热形成零件。本图画出简化剖面，不按真实比例。</desc>
