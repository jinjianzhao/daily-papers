<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1050" viewBox="0 0 1040 1050" role="img" aria-labelledby="title desc">
<title id="title">线材打印和树脂打印的后半段流程</title><desc id="desc">模型与切片之后，线材打印通常经过适当冷却取件、拆支撑整理和检查；树脂打印通常还要清洗干燥与后固化，支撑移除阶段按材料安排。</desc>
<defs><marker id="arrow" refX="8" refY="4.5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#5275a1"/></marker></defs>
<rect width="1040" height="1050" rx="20" fill="#f5f8fc"/>
<text x="37" y="52" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#293e56">从模型到成品：两条流程有不同的后半段</text>
<text x="37" y="91" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#61758e">常见工作顺序示意；具体材料与设备说明优先。</text>
<rect x="180" y="123" width="680" height="78" rx="11" fill="#e9effa" stroke="#c9d6e5"/>
<text x="520" y="169" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#293e56">确认模型、尺寸与材料 → 相应设备的切片任务</text>
<text x="78" y="245" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#293e56">FDM / FFF 线材路线</text>
<text x="603" y="245" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#293e56">树脂光固化路线</text>
<rect x="55" y="270" width="420" height="73" rx="11" fill="#e5f4ec" stroke="#c9d6e5"/>
<text x="265" y="315" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#293e56">打印</text>
<path d="M265 344 V372" fill="none" stroke="#5275a1" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="374" width="420" height="73" rx="11" fill="#e5f4ec" stroke="#c9d6e5"/>
<text x="265" y="419" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#293e56">适当冷却后取件</text>
<path d="M265 448 V476" fill="none" stroke="#5275a1" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="478" width="420" height="73" rx="11" fill="#e5f4ec" stroke="#c9d6e5"/>
<text x="265" y="523" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#293e56">拆支撑与表面整理</text>
<path d="M265 552 V580" fill="none" stroke="#5275a1" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="582" width="420" height="73" rx="11" fill="#e5f4ec" stroke="#c9d6e5"/>
<text x="265" y="627" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#293e56">尺寸 / 装配 / 使用检查</text>
<rect x="565" y="270" width="420" height="73" rx="11" fill="#f0eafa" stroke="#c9d6e5"/>
<text x="775" y="315" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#293e56">打印</text>
<path d="M775 344 V372" fill="none" stroke="#5275a1" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="565" y="374" width="420" height="73" rx="11" fill="#f0eafa" stroke="#c9d6e5"/>
<text x="775" y="419" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#293e56">取件并清洗残留树脂</text>
<path d="M775 448 V476" fill="none" stroke="#5275a1" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="565" y="478" width="420" height="73" rx="11" fill="#f0eafa" stroke="#c9d6e5"/>
<text x="775" y="523" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#293e56">充分干燥</text>
<path d="M775 552 V580" fill="none" stroke="#5275a1" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="565" y="582" width="420" height="73" rx="11" fill="#f0eafa" stroke="#c9d6e5"/>
<text x="775" y="627" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#293e56">按材料规定后固化</text>
<path d="M775 656 V684" fill="none" stroke="#5275a1" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="565" y="686" width="420" height="73" rx="11" fill="#f0eafa" stroke="#c9d6e5"/>
<text x="775" y="731" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#293e56">去支撑与必要的表面整理</text>
<path d="M775 760 V788" fill="none" stroke="#5275a1" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="565" y="790" width="420" height="73" rx="11" fill="#f0eafa" stroke="#c9d6e5"/>
<text x="775" y="835" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#293e56">尺寸 / 外观 / 使用检查</text>
<rect x="55" y="710" width="420" height="155" rx="11" fill="#fff" stroke="#c9d6e5"/>
<text x="78" y="751" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#293e56">需要时继续：</text>
<text x="78" y="789" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#293e56">打磨、上色、装配或其他后处理</text>
<text x="78" y="831" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#61758e">所需步骤取决于最终用途。</text>
<text x="38" y="940" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#293e56">树脂路线的支撑移除阶段可调整；清洗介质、干燥与固化条件按材料规定。</text>
<text x="38" y="984" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#61758e">步骤数量不代表耗时比例。打印任务结束以后，仍要检查成品是否满足用途。</text>
</svg>
