<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530" role="img" aria-label="用户1和4经由共同好友2和3分别产生一票，累加得到2">
<rect width="800" height="530" rx="16" fill="#f5f9ff"/>
<g font-family="Arial,Microsoft YaHei,sans-serif" fill="#20354b" text-anchor="middle">
<text x="400" y="42" font-size="24" font-weight="bold">每位共同好友贡献一次计数</text>
<g stroke="#5792c8" stroke-width="4"><path d="M145 230 L400 115 L655 230 M145 230 L400 345 L655 230" fill="none"/></g>
<g fill="#fff" stroke="#5792c8" stroke-width="3"><circle cx="145" cy="230" r="42"/><circle cx="655" cy="230" r="42"/><circle cx="400" cy="115" r="34"/><circle cx="400" cy="345" r="34"/></g>
<g font-size="27" font-weight="bold"><text x="145" y="240">1</text><text x="655" y="240">4</text><text x="400" y="125">2</text><text x="400" y="355">3</text></g>
<text x="145" y="299" font-size="20">待推荐用户</text><text x="655" y="299" font-size="20">候选用户</text>
<g font-size="19"><text x="400" y="178">好友 2 发出 (1,4): +1</text><text x="400" y="293">好友 3 发出 (1,4): +1</text></g>
<rect x="95" y="410" width="610" height="62" rx="10" fill="#dfeefd"/>
<text x="400" y="450" font-size="23">按用户对聚合：(1,4) 的共同好友数 = 2</text>
<text x="400" y="505" font-size="18">再排除已有好友，按计数降序、ID 升序取前 10 名</text>
</g></svg>