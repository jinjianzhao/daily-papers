<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge 文章</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033}
    *{box-sizing:border-box}body{margin:0;background:#f7f9fb;line-height:1.7}
    a{color:#1769aa}.topbar{border-bottom:1px solid #dfe7ef;background:#fff}.topbar-inner{width:min(1180px,calc(100% - 40px));margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0}.brand{color:#334155;font-size:14px;font-weight:800;text-decoration:none}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav a{padding:6px 10px;border-radius:6px;color:#64748b;font-size:13px;font-weight:700;text-decoration:none}.nav a[aria-current=page]{background:#eaf3fb;color:#1769aa}
    main{width:min(1240px,calc(100% - 56px));margin:0 auto;padding:48px 0 80px}.back{font-size:14px;font-weight:700}.article{margin-top:24px;padding:42px 64px;background:#fff;border:1px solid #dfe7ef;border-radius:12px;box-shadow:0 8px 24px rgba(36,54,74,.04)}.article h1{margin:0 0 30px;color:#1769aa;font-size:32px;line-height:1.3}.article h2{margin:42px 0 12px;color:#24364a;font-size:22px}.article h3{margin:30px 0 10px;color:#334155;font-size:18px}.article p,.article li{color:#354052}.article p{max-width:88ch}.article code{padding:2px 5px;border-radius:4px;background:#eef3f7;color:#24516e;font:500 .92em/1.4 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}.article pre{position:relative;overflow:auto;margin:18px 0 26px;padding:42px 24px 22px;border:1px solid #d8dee4;border-radius:8px;background:#fff;color:#24292f;box-shadow:0 2px 8px rgba(36,54,74,.08);font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;tab-size:4;-webkit-overflow-scrolling:touch}.article pre code{display:block;padding:0;background:transparent;color:#24292f;font:inherit;white-space:pre}.code-language{position:absolute;top:0;left:0;right:0;padding:8px 14px;border-bottom:1px solid #d8dee4;background:#f1f3f5;color:#57606a;font:700 11px/1 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;letter-spacing:.08em}.article blockquote{margin:20px 0;padding:10px 18px;border-left:4px solid #9bc6e5;background:#f5f9fc;color:#526679}.article img{max-width:100%;height:auto}.collapse-block{margin:22px 0;border:1px solid #cbd8e3;border-radius:10px;background:#f8fbfd;overflow:hidden}.collapse-block summary{cursor:pointer;padding:13px 18px;color:#24516e;font-weight:800;list-style:none}.collapse-block summary::-webkit-details-marker{display:none}.collapse-block summary::before{display:inline-block;margin-right:9px;color:#1769aa;content:"▶";font-size:11px;transition:transform .15s ease}.collapse-block[open] summary::before{transform:rotate(90deg)}.collapse-body{padding:2px 20px 16px;border-top:1px solid #dfe7ef;background:#fff}.collapse-body pre{margin:16px 0}.collapse-return{display:block;margin-top:18px;color:#64748b;font-size:13px}@media(max-width:680px){.topbar-inner,main{width:min(100% - 28px,1240px)}.article{padding:28px 20px}.article h1{font-size:27px}.article pre{padding:38px 16px 16px;font-size:13px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="../">论文阅读</a><nav class="nav" aria-label="报告与专题"><a href="../date/">日报</a><a href="../week/">周报</a><a href="../month/">月报</a><a href="../surveys/">Survey</a><a href="./" aria-current="page">Knowledge</a></nav></div></header>
  <main><a class="back" href="./">返回 Knowledge 目录</a><article id="article" class="article"><p>正在加载文章...</p></article></main>
  <script src="assets/marked.min.js"></script>
  <script src="assets/shiki-python.min.js?v=1"></script>
  <script>
    const article = document.getElementById('article');
    const slug = new URLSearchParams(window.location.search).get('slug');
    const fallback = '文章地址缺少 slug 参数。';
    async function loadArticle() {
      if (!slug || !/^[a-z0-9-]+$/.test(slug)) { article.textContent = fallback; return; }
      try {
        const response = await fetch(`index.json`);
        if (!response.ok) throw new Error('目录加载失败');
        const entries = await response.json();
        const entry = entries.find(item => item.slug === slug);
        if (!entry) throw new Error('文章不存在');
        const markdownResponse = await fetch(entry.path);
        if (!markdownResponse.ok) throw new Error('文章加载失败');
        const markdown = await markdownResponse.text();
        document.title = `${entry.title} · Knowledge`;
        article.innerHTML = renderMarkdownWithCollapses(markdown);
        await decorateCodeBlocks();
        // Markdown is stored beside the article metadata, so resolve relative
        // images and links from the Markdown file rather than this HTML shell.
        const markdownBase = new URL(entry.path, window.location.href);
        article.querySelectorAll('[src]').forEach(node => {
          const source = node.getAttribute('src');
          if (source && !/^(?:[a-z]+:|\/\/|#)/i.test(source)) node.setAttribute('src', new URL(source, markdownBase).href);
        });
        article.querySelectorAll('a[href]').forEach(node => {
          const href = node.getAttribute('href');
          if (href && !/^(?:[a-z]+:|\/\/|#)/i.test(href)) node.setAttribute('href', new URL(href, markdownBase).href);
        });
      } catch (error) {
        article.textContent = error.message;
      }
    }
    // text-preview 的 :::collapse 不是标准 Markdown。Knowledge 仍以 Markdown
    // 为唯一正文来源，因此在展示层实现同样的语法，而不是维护第二份 HTML。
    function renderMarkdownWithCollapses(source) {
      const lines = source.replace(/\r\n?/g, '\n').split('\n');
      const output = [];
      let plainMarkdown = [];
      const flushMarkdown = () => {
        if (plainMarkdown.length) output.push(marked.parse(plainMarkdown.join('\n')));
        plainMarkdown = [];
      };
      for (let index = 0; index < lines.length; index += 1) {
        const opening = lines[index].match(/^:::collapse\s+id="([A-Za-z][A-Za-z0-9_.-]*)"\s+title="([^"]+)"\s*$/);
        if (!opening) { plainMarkdown.push(lines[index]); continue; }
        flushMarkdown();
        const inner = [];
        let closed = false;
        for (index += 1; index < lines.length; index += 1) {
          if (lines[index].trim() === ':::') { closed = true; break; }
          inner.push(lines[index]);
        }
        if (!closed) throw new Error(`折叠块 ${opening[1]} 缺少结束标记 :::`);
        const title = escapeHtml(opening[2]);
        const id = escapeHtml(opening[1]);
        const body = marked.parse(inner.join('\n'));
        output.push(`<details id="${id}" class="collapse-block"><summary>${title}</summary><div class="collapse-body">${body}<a class="collapse-return" href="#${id}">收起并返回标题</a></div></details>`);
      }
      flushMarkdown();
      // Each Markdown segment was parsed once. Running marked.parse on the
      // assembled HTML would turn code fences and docstrings into nested blocks.
      return output.join('\n');
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    }
    async function decorateCodeBlocks() {
      for (const block of article.querySelectorAll('pre')) {
        const code = block.querySelector('code');
        const languageClass = [...(code?.classList || [])].find(name => name.startsWith('language-'));
        const language = languageClass ? languageClass.slice('language-'.length).toUpperCase() : 'CODE';
        const label = document.createElement('span');
        label.className = 'code-language';
        label.textContent = language;
        block.prepend(label);
        if (window.highlightKnowledgePython && language === 'PYTHON') {
          // Shiki uses VS Code's Python grammar and Light+ color theme.
          code.innerHTML = await window.highlightKnowledgePython(code.textContent);
        }
      }
    }
    loadArticle();
  </script>
</body>
</html>
